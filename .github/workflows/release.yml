name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build, Gate, and Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install System Dependencies (Tesseract & Poppler for OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils libtesseract-dev

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Install Python Release Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine wheel pytest
          pip install -e packages/ico-cache-py
          pip install -r packages/ico-cache-py/pyproject.toml || true

      - name: Run Build & Test Gate (Step 3 Gate)
        run: |
          ./scripts/release_gate.sh

      # Python Packaging & Publish
      - name: Build Python Distribution (ico-cache-py)
        run: |
          cd packages/ico-cache-py
          python -m build
          twine check dist/*

      - name: Publish to TestPyPI First
        if: env.TEST_PYPI_API_TOKEN != ''
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          twine upload --repository testpypi packages/ico-cache-py/dist/* --skip-existing

      - name: TestPyPI Smoke Test
        if: env.TEST_PYPI_API_TOKEN != ''
        env:
          TEST_PYPI_API_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          python3 -m venv testpypi_venv
          source testpypi_venv/bin/activate
          pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ ico-cache
          python3 scripts/smoke_test_installed.py
          deactivate
          rm -rf testpypi_venv

      - name: Publish to Production PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload packages/ico-cache-py/dist/*

      # JavaScript SDK Packaging & Publish
      - name: Build JS SDK (ico-cache-js)
        if: env.NPM_TOKEN != ''
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/ico-cache-js
          npm ci || npm install
          npm run build

      - name: Publish to npm (Dry Run)
        if: env.NPM_TOKEN != ''
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/ico-cache-js
          npm publish --dry-run

      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/ico-cache-js
          npm publish --access public

      # Container Image Build & Push to GHCR
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/financial-rag-demo/docker/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ico-cache:latest
            ghcr.io/${{ github.repository_owner }}/ico-cache:${{ github.ref_name }}

      # GitHub Release Generation
      - name: Create GitHub Release with Notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/check_changelog.py --extract > RELEASE_NOTES.md
          gh release create "${{ github.ref_name }}" \
            --title "Release ${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md

  fresh-install-smoke-test:
    name: Post-Release Fresh-Install Smoke Test
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install System Dependencies for OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Wait for PyPI and npm index propagation
        run: |
          echo "Waiting 45s for index replication on PyPI and npm..."
          sleep 45

      - name: Fresh-Install Smoke Test (PyPI)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Installing published version ico-cache==${VERSION} from PyPI..."
          pip install --no-cache-dir "ico-cache==${VERSION}"
          python3 scripts/smoke_test_installed.py

      - name: Fresh-Install Smoke Test (npm)
        if: env.NPM_TOKEN != ''
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Installing published version ico-cache-js@${VERSION} from npm..."
          npm install -g "ico-cache-js@${VERSION}"
          node scripts/smoke_test_installed_js.js

      - name: Automated Rollback / Yank on Smoke Failure
        if: failure()
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "CRITICAL: Fresh-install smoke test failed post-publish!"
          echo "Yanking release on PyPI..."
          pip install twine
          twine yank --version "${VERSION}" ico-cache || true
          if [ -n "${NODE_AUTH_TOKEN}" ]; then
            echo "Deprecating release on npm..."
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
            npm deprecate "ico-cache-js@${VERSION}" "Yanked due to automated post-release smoke test failure" || true
          else
            echo "NPM_TOKEN not set — skipping npm deprecation."
          fi
          exit 1


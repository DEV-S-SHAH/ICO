name: CD - Deploy to Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy'
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  KUBECONFIG_STAGING: ${{ secrets.KUBECONFIG_STAGING }}

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Set up kubectl
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBECONFIG_STAGING }}

      - name: Add Helm repos
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Update dependencies
        run: |
          cd deploy/helm/ico-cache
          helm dependency update

      - name: Get image tags
        id: images
        run: |
          API_TAG=$(docker inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:develop --format '{{index .RepoDigests 0}}' 2>/dev/null | cut -d'@' -f2 || echo "sha256:dev")
          WORKER_TAG=$(docker inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker:develop --format '{{index .RepoDigests 0}}' 2>/dev/null | cut -d'@' -f2 || echo "sha256:dev")
          echo "api_digest=$API_TAG" >> $GITHUB_OUTPUT
          echo "worker_digest=$WORKER_TAG" >> $GITHUB_OUTPUT

      - name: Deploy to Staging
        run: |
          cd deploy/helm/ico-cache
          helm upgrade --install ico-cache-staging . \
            --namespace ico-cache-staging \
            --create-namespace \
            --set global.environment=staging \
            --set api.image.digest=${{ steps.images.outputs.api_digest }} \
            --set worker.image.digest=${{ steps.images.outputs.worker_digest }} \
            --set api.replicaCount=2 \
            --set worker.replicaCount=1 \
            --set redis.enabled=true \
            --set qdrant.enabled=true \
            --set secrets.create=true \
            --set secrets.redisPassword=${{ secrets.REDIS_PASSWORD_STAGING }} \
            --set secrets.geminiApiKey=${{ secrets.GEMINI_API_KEY }} \
            --set secrets.qdrantApiKey=${{ secrets.QDRANT_API_KEY_STAGING }} \
            --set ingress.enabled=true \
            --set ingress.hosts[0].host=staging.ico-cache.example.com \
            --set networkPolicy.enabled=true \
            --set monitoring.serviceMonitor.enabled=true \
            --wait --timeout 15m \
            --atomic

      - name: Run staging smoke tests
        run: |
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=ico-cache -n ico-cache-staging --timeout=300s
          kubectl port-forward -n ico-cache-staging svc/ico-cache-staging-api 8000:8000 &
          PORT_FORWARD_PID=$!
          sleep 15
          curl -f http://localhost:8000/v1/health || exit 1
          curl -f http://localhost:8000/v1/ready || exit 1
          kill $PORT_FORWARD_PID

      - name: Notify deployment
        if: always()
        run: |
          echo "Staging deployment completed"
          # Add Slack/Teams notification here
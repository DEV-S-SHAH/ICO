name: CI

on:
  push:
    branches: [ main, master, "**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-asyncio
          pip install -r apps/financial-rag-demo/docker/requirements.txt || pip install -r requirements.txt
          pip install -e packages/ico-cache-py

      - name: Lint (Ruff)
        run: |
          ruff check packages/ico-cache-py/src

      - name: Type-check (Mypy)
        run: |
          mypy packages/ico-cache-py/src

      - name: Run Core Test Suite (Pytest)
        run: |
          PYTHONPATH=packages/ico-cache-py/src pytest packages/ico-cache-py/tests/

      - name: Start API Server for Concurrency Test
        run: |
          PYTHONPATH=packages/ico-cache-py/src uvicorn apps.financial-rag-demo.api.main:app --host 127.0.0.1 --port 8000 &
          sleep 3

      - name: Run Concurrency Test
        run: |
          python3 test_concurrency.py

      - name: Run False-Hit Evaluation Harness (0% Baseline Check)
        run: |
          PYTHONPATH=packages/ico-cache-py/src python3 eval_harness.py

  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build JS SDK
        run: |
          cd packages/ico-cache-js
          npm ci || npm install
          npm run build

  helm-lint-and-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint Helm Chart
        run: |
          helm lint deploy/helm/ico-cache

      - name: Template Helm Chart (Dry-run)
        run: |
          helm template ico-cache deploy/helm/ico-cache --debug


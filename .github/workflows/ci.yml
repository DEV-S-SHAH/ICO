name: CI

on:
  push:
    branches: [ main, master, "**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        options: >-
          --health-cmd "wget -qO- http://localhost:6333/ || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Qdrant to be ready
        run: |
          echo "Waiting for Qdrant on port 6333..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:6333/ > /dev/null 2>&1; then
              echo "Qdrant is ready after $((i*2)) seconds"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:6333/ || (echo "ERROR: Qdrant not ready after 60s" && exit 1)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-asyncio
          pip install -e "packages/ico-cache-py[loaders]"
          # Demo app deps (not in core package)
          pip install -r apps/financial-rag-demo/requirements-demo.txt

      - name: Lint (Ruff)
        run: |
          ruff check packages/ico-cache-py/src apps/financial-rag-demo

      - name: Type-check (Mypy)
        run: |
          mypy packages/ico-cache-py/src

      - name: Run Core Test Suite (Pytest)
        run: |
          PYTHONPATH=packages/ico-cache-py/src:. pytest packages/ico-cache-py/tests/

      - name: Run False-Hit Evaluation Harness (0% Baseline Check)
        run: |
          PYTHONPATH=packages/ico-cache-py/src:. python3 eval_harness.py

  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build JS SDK
        run: |
          cd packages/ico-cache-js
          npm ci || npm install
          npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/financial-rag-demo/docker/Dockerfile.api
          push: false
          load: true
          tags: ico-cache-api:ci

      - name: Build UI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/financial-rag-demo/docker/Dockerfile.ui
          push: false
          load: true
          tags: ico-cache-ui:ci

      # Guards the exact regressions that broke fresh-checkout builds:
      # the gitignored root requirements.txt and the missing examples/ source.
      - name: Smoke-test API image imports
        run: |
          docker run --rm -e PYTHONPATH=/app:/app/apps/financial-rag-demo \
            --entrypoint python ico-cache-api:ci -c "import importlib.util as u; import ico_cache, slowapi, litellm; import examples.financial_schema as fs; assert fs.financial_schema is not None; assert u.find_spec('api.main') is not None; print('API image import smoke test OK')"

  helm-lint-and-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.0

      - name: Lint Helm Chart
        run: |
          helm lint deploy/helm/ico-cache

      - name: Template Helm Chart (Dry-run)
        run: |
          helm template ico-cache deploy/helm/ico-cache --debug


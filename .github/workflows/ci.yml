name: CI

on:
  push:
    branches: [ main, master, "**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        options: >-
          --health-cmd "curl -sf http://localhost:6333/healthz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-asyncio
          pip install -e packages/ico-cache-py
          # Demo app deps (not in core package)
          pip install -r apps/financial-rag-demo/requirements-demo.txt

      - name: Lint (Ruff)
        run: |
          ruff check packages/ico-cache-py/src

      - name: Type-check (Mypy)
        run: |
          mypy packages/ico-cache-py/src

      - name: Run Core Test Suite (Pytest)
        run: |
          PYTHONPATH=packages/ico-cache-py/src:. pytest packages/ico-cache-py/tests/

      - name: Run False-Hit Evaluation Harness (0% Baseline Check)
        run: |
          PYTHONPATH=packages/ico-cache-py/src:. python3 eval_harness.py

  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build JS SDK
        run: |
          cd packages/ico-cache-js
          npm ci || npm install
          npm run build

  helm-lint-and-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint Helm Chart
        run: |
          helm lint deploy/helm/ico-cache

      - name: Template Helm Chart (Dry-run)
        run: |
          helm template ico-cache deploy/helm/ico-cache --debug


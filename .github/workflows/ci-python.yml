name: CI - Python Package

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/ico-cache-py/**'
      - '.github/workflows/ci-python.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/ico-cache-py/**'

env:
  PYTHON_VERSION: '3.11'
  POETRY_VERSION: '1.8.3'

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Poetry
        run: pip install poetry==${{ env.POETRY_VERSION }}

      - name: Install dependencies
        working-directory: packages/ico-cache-py
        run: |
          poetry install --with dev,loaders,observability,audit --no-interaction

      - name: Run Ruff
        working-directory: packages/ico-cache-py
        run: poetry run ruff check src tests

      - name: Run MyPy
        working-directory: packages/ico-cache-py
        run: poetry run mypy src

      - name: Run Bandit (security)
        working-directory: packages/ico-cache-py
        run: poetry run bandit -r src -f json -o bandit-report.json || true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: packages/ico-cache-py/bandit-report.json

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Poetry
        run: pip install poetry==${{ env.POETRY_VERSION }}

      - name: Install dependencies
        working-directory: packages/ico-cache-py
        run: |
          poetry install --with dev,loaders,observability,audit --no-interaction

      - name: Run tests
        working-directory: packages/ico-cache-py
        run: |
          poetry run pytest tests/ -v --tb=short -x --cov=ico_cache --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./packages/ico-cache-py/coverage.xml
          flags: unittests
          name: ico-cache-python-${{ matrix.python-version }}

  test-windows:
    name: Tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Poetry
        run: pip install poetry==${{ env.POETRY_VERSION }}

      - name: Install dependencies
        working-directory: packages/ico-cache-py
        run: |
          poetry install --with dev,loaders,observability,audit --no-interaction

      - name: Run tests
        working-directory: packages/ico-cache-py
        run: |
          poetry run pytest tests/ -v --tb=short -x

  test-macos:
    name: Tests (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          brew install tesseract poppler

      - name: Install Poetry
        run: pip install poetry==${{ env.POETRY_VERSION }}

      - name: Install dependencies
        working-directory: packages/ico-cache-py
        run: |
          poetry install --with dev,loaders,observability,audit --no-interaction

      - name: Run tests
        working-directory: packages/ico-cache-py
        run: |
          poetry run pytest tests/ -v --tb=short -x

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Poetry
        run: pip install poetry==${{ env.POETRY_VERSION }}

      - name: Install dependencies
        working-directory: packages/ico-cache-py
        run: |
          poetry install --with audit --no-interaction

      - name: Run pip-audit
        working-directory: packages/ico-cache-py
        run: |
          poetry run pip-audit --format=json --output=pip-audit-report.json || true

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: packages/ico-cache-py/pip-audit-report.json

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, test-windows, test-macos, audit]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Poetry
        run: pip install poetry==${{ env.POETRY_VERSION }}

      - name: Build package
        working-directory: packages/ico-cache-py
        run: |
          poetry build

      - name: Verify package
        working-directory: packages/ico-cache-py
        run: |
          poetry run pip install dist/*.whl
          python -c "import ico_cache; print(ico_cache.__version__)"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: packages/ico-cache-py/dist/
          retention-days: 30
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/resourcequotas
  - ../../base/limitranges
  - ../../base/backup

namespace: ico-cache

labels:
  - pairs:
      environment: production
      managed-by: kustomize
    includeSelectors: true
    includeTemplates: true

images:
  - name: ico-cache-api
    newTag: latest
  - name: ico-cache-worker
    newTag: latest

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ico-cache-api
      spec:
        replicas: 3
        template:
          spec:
            containers:
              - name: api
                resources:
                  limits:
                    cpu: "2000m"
                    memory: "2Gi"
                  requests:
                    cpu: "500m"
                    memory: "1Gi"
    target:
      kind: Deployment
      labelSelector: app.kubernetes.io/component=api
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ico-cache-worker
      spec:
        replicas: 2
        template:
          spec:
            containers:
              - name: worker
                resources:
                  limits:
                    cpu: "1000m"
                    memory: "1Gi"
                  requests:
                    cpu: "250m"
                    memory: "512Mi"
    target:
      kind: Deployment
      labelSelector: app.kubernetes.io/component=worker
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: ico-cache-redis
      spec:
        template:
          spec:
            containers:
              - name: redis
                resources:
                  limits:
                    cpu: "1000m"
                    memory: "1Gi"
                  requests:
                    cpu: "250m"
                    memory: "256Mi"
    target:
      kind: StatefulSet
      labelSelector: app.kubernetes.io/component=redis
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: ico-cache-qdrant
      spec:
        replicas: 2
        template:
          spec:
            containers:
              - name: qdrant
                resources:
                  limits:
                    cpu: "2000m"
                    memory: "4Gi"
                  requests:
                    cpu: "500m"
                    memory: "1Gi"
    target:
      kind: StatefulSet
      labelSelector: app.kubernetes.io/component=qdrant
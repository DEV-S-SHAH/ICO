apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/resourcequotas
  - ../../base/limitranges

namespace: ico-cache-dev

labels:
  - pairs:
      environment: development
      managed-by: kustomize
    includeSelectors: true
    includeTemplates: true

images:
  - name: ico-cache-api
    newTag: dev
  - name: ico-cache-worker
    newTag: dev

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ico-cache-api
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: api
                resources:
                  limits:
                    cpu: "500m"
                    memory: "512Mi"
                  requests:
                    cpu: "100m"
                    memory: "128Mi"
    target:
      kind: Deployment
      labelSelector: app.kubernetes.io/component=api
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ico-cache-worker
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: worker
                resources:
                  limits:
                    cpu: "250m"
                    memory: "256Mi"
                  requests:
                    cpu: "50m"
                    memory: "64Mi"
    target:
      kind: Deployment
      labelSelector: app.kubernetes.io/component=worker
# Production environment values
global:
  environment: production

api:
  replicaCount: 3
  resources:
    limits:
      cpu: "2000m"
      memory: "2Gi"
    requests:
      cpu: "500m"
      memory: "1Gi"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 2

worker:
  enabled: true
  replicaCount: 2
  resources:
    limits:
      cpu: "1000m"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "512Mi"

redis:
  enabled: true
  persistence:
    enabled: true
    size: "2Gi"
    storageClass: "fast-ssd"
  resources:
    limits:
      cpu: "1000m"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "256Mi"

qdrant:
  enabled: true
  replicaCount: 2
  persistence:
    enabled: true
    size: "10Gi"
    storageClass: "fast-ssd"
  resources:
    limits:
      cpu: "2000m"
      memory: "4Gi"
    requests:
      cpu: "500m"
      memory: "1Gi"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "200"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
  hosts:
    - host: ico-cache.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: ico-cache-prod-tls
      hosts:
        - ico-cache.example.com

networkPolicy:
  enabled: true

monitoring:
  serviceMonitor:
    enabled: true
    namespace: monitoring
    interval: 15s
    scrapeTimeout: 10s

secrets:
  create: true
  # These MUST be set via --set or external secrets operator
  redisPassword: ""
  geminiApiKey: ""
  qdrantApiKey: ""
  langfusePublicKey: ""
  langfuseSecretKey: ""

externalSecrets:
  enabled: true
  refreshInterval: "15m"
  secretStoreRef:
    name: "vault-backend"
    kind: "ClusterSecretStore"
  targetSecretName: "ico-cache-secrets"
  data:
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: ico-cache/redis
        property: password
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: ico-cache/gemini
        property: api_key
    - secretKey: QDRANT_API_KEY
      remoteRef:
        key: ico-cache/qdrant
        property: api_key

backup:
  enabled: true
  schedule: "0 2 * * *"

priorityClassName: "system-cluster-critical"

topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
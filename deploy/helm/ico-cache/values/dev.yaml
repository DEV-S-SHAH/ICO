# Development environment values
global:
  environment: development

api:
  replicaCount: 1
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
  autoscaling:
    enabled: false
  podDisruptionBudget:
    enabled: false

worker:
  enabled: true
  replicaCount: 1
  resources:
    limits:
      cpu: "250m"
      memory: "256Mi"
    requests:
      cpu: "50m"
      memory: "64Mi"

redis:
  enabled: true
  persistence:
    enabled: false
  resources:
    limits:
      cpu: "250m"
      memory: "256Mi"
    requests:
      cpu: "50m"
      memory: "64Mi"

qdrant:
  enabled: true
  persistence:
    enabled: false
  resources:
    limits:
      cpu: "500m"
      memory: "1Gi"
    requests:
      cpu: "100m"
      memory: "256Mi"

ingress:
  enabled: false

networkPolicy:
  enabled: false

monitoring:
  serviceMonitor:
    enabled: false

secrets:
  create: true
  redisPassword: "devredissecret"
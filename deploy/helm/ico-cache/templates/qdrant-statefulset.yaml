{{- if .Values.qdrant.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ico-cache.fullname" . }}-qdrant
  labels:
    {{- include "ico-cache.labels" . | nindent 4 }}
    app.kubernetes.io/component: qdrant
spec:
  serviceName: {{ include "ico-cache.fullname" . }}-qdrant
  replicas: {{ .Values.qdrant.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "ico-cache.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: qdrant
  template:
    metadata:
      labels:
        {{- include "ico-cache.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: qdrant
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.qdrant.service.httpPort }}"
        prometheus.io/path: "/metrics"
    spec:
      {{- include "ico-cache.podSpec" (dict "ctx" $ "podSecurityContext" .Values.qdrant.podSecurityContext) | nindent 6 }}
      {{- with .Values.qdrant.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.qdrant.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.qdrant.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: {{ .Values.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            {{- toYaml .Values.topologySpreadConstraints.labelSelector | nindent 12 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      containers:
        - name: qdrant
          image: {{ include "ico-cache.image" .Values.qdrant.image | quote }}
          imagePullPolicy: {{ .Values.qdrant.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.qdrant.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.qdrant.service.httpPort }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.qdrant.service.grpcPort }}
              protocol: TCP
          volumeMounts:
            - name: storage
              mountPath: /qdrant/storage
            - name: snapshots
              mountPath: /qdrant/snapshots
          livenessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.qdrant.resources | nindent 12 }}
          env:
            - name: QDRANT__SERVICE__HTTP_PORT
              value: {{ .Values.qdrant.service.httpPort | quote }}
            - name: QDRANT__SERVICE__GRPC_PORT
              value: {{ .Values.qdrant.service.grpcPort | quote }}
            - name: QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS
              value: {{ .Values.qdrant.config.storage.performance.max_search_threads | quote }}
      volumes:
        - name: snapshots
          emptyDir: {}
        {{- if not .Values.qdrant.persistence.enabled }}
        - name: storage
          emptyDir: {}
        {{- end }}
  {{- if .Values.qdrant.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes:
          - {{ .Values.qdrant.persistence.accessMode }}
        {{- with .Values.qdrant.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.qdrant.persistence.size }}
  {{- end }}
  {{- if .Values.qdrant.persistence.retainOnDelete }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  {{- end }}
{{- end }}
{{- if and .Values.secrets.create (not .Values.externalSecrets.enabled) }}
{{- $redisPassword := .Values.secrets.redisPassword | default .Values.redis.auth.password }}
{{- $rateLimitUri := .Values.secrets.rateLimitStorageUri }}
{{- if not $rateLimitUri }}
{{- if .Values.redis.enabled }}
{{- $rateLimitUri = printf "redis://:%s@%s-redis:%v/0" $redisPassword (include "ico-cache.fullname" .) .Values.redis.service.port }}
{{- else }}
{{- $rateLimitUri = "memory://" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ico-cache.fullname" . }}-secrets
  labels:
    {{- include "ico-cache.labels" . | nindent 4 }}
type: Opaque
stringData:
  REDIS_AUTH: {{ $redisPassword | quote }}
  RATE_LIMIT_STORAGE_URI: {{ $rateLimitUri | quote }}
  QDRANT_API_KEY: {{ .Values.secrets.qdrantApiKey | quote }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}
  LANGFUSE_PUBLIC_KEY: {{ .Values.secrets.langfusePublicKey | quote }}
  LANGFUSE_SECRET_KEY: {{ .Values.secrets.langfuseSecretKey | quote }}
{{- end }}

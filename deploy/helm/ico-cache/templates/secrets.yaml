{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ico-cache.fullname" . }}-secrets
  labels:
    {{- include "ico-cache.labels" . | nindent 4 }}
type: Opaque
stringData:
  REDIS_AUTH: {{ .Values.secrets.redisPassword | default .Values.redis.auth.password | quote }}
  QDRANT_API_KEY: {{ .Values.secrets.qdrantApiKey | quote }}
  LANGFUSE_PUBLIC_KEY: {{ .Values.secrets.langfusePublicKey | quote }}
  LANGFUSE_SECRET_KEY: {{ .Values.secrets.langfuseSecretKey | quote }}
{{- end }}

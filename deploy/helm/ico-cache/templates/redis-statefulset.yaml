{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ico-cache.fullname" . }}-redis
  labels:
    {{- include "ico-cache.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: {{ include "ico-cache.fullname" . }}-redis
  replicas: 1
  selector:
    matchLabels:
      {{- include "ico-cache.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "ico-cache.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
      annotations:
        {{- if .Values.redis.exporter.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
        prometheus.io/path: "/metrics"
        {{- end }}
    spec:
      {{- include "ico-cache.podSpec" (dict "ctx" $ "podSecurityContext" .Values.redis.podSecurityContext) | nindent 6 }}
      {{- with .Values.redis.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.redis.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.redis.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: {{ .Values.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            {{- toYaml .Values.topologySpreadConstraints.labelSelector | nindent 12 }}
      {{- end }}
      containers:
        - name: redis
          image: {{ include "ico-cache.image" .Values.redis.image | quote }}
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.redis.containerSecurityContext | nindent 12 }}
          command:
            - redis-server
            - "--requirepass"
            - "$(REDIS_AUTH)"
            - "--appendonly"
            - {{ .Values.redis.config.appendonly | quote }}
            - "--dir"
            - "/data"
            - "--maxmemory"
            - {{ .Values.redis.config.maxmemory | quote }}
            - "--maxmemory-policy"
            - {{ index .Values.redis.config "maxmemory-policy" | quote }}
            - "--save"
            - {{ .Values.redis.config.save | quote }}
          env:
            - name: REDIS_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ include "ico-cache.secretName" . }}
                  key: REDIS_AUTH
          ports:
            - name: redis
              containerPort: {{ .Values.redis.service.port }}
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
      volumes:
        {{- if not .Values.redis.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.redis.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - {{ .Values.redis.persistence.accessMode }}
        {{- with .Values.redis.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.redis.persistence.size }}
  {{- end }}
  {{- if .Values.redis.persistence.retainOnDelete }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  {{- end }}
{{- end }}
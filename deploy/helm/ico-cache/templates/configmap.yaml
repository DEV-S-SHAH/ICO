apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ico-cache.fullname" . }}-config
  labels:
    {{- include "ico-cache.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.env.ENVIRONMENT | quote }}
  API_HOST: {{ .Values.env.API_HOST | quote }}
  API_PORT: {{ .Values.env.API_PORT | quote }}
  REDIS_HOST: {{ include "ico-cache.fullname" . }}-redis
  REDIS_PORT: {{ .Values.redis.service.port | quote }}
  QDRANT_HOST: {{ include "ico-cache.fullname" . }}-qdrant
  QDRANT_PORT: {{ .Values.qdrant.service.httpPort | quote }}
  LLM_MODEL: {{ .Values.env.LLM_MODEL | quote }}
  LLM_TIMEOUT_SECONDS: {{ .Values.env.LLM_TIMEOUT_SECONDS | quote }}
  LLM_MAX_RETRIES: {{ .Values.env.LLM_MAX_RETRIES | quote }}
  LANGFUSE_HOST: {{ .Values.env.LANGFUSE_HOST | quote }}
  TENANT_ISOLATION_MODE: {{ .Values.tenants.isolation_mode | quote }}
  RATE_LIMIT_DEFAULT: {{ .Values.env.RATE_LIMIT_DEFAULT | quote }}
  LOG_LEVEL: {{ .Values.env.LOG_LEVEL | quote }}
  LOG_JSON: {{ .Values.env.LOG_JSON | quote }}
  OTEL_SERVICE_NAME: {{ .Values.env.OTEL_SERVICE_NAME | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.env.OTEL_EXPORTER_OTLP_ENDPOINT | quote }}
  OCR_ENABLED: {{ .Values.env.OCR_ENABLED | quote }}
  OCR_LANGUAGES: {{ .Values.env.OCR_LANGUAGES | quote }}
  OCR_DPI: {{ .Values.env.OCR_DPI | quote }}
  INGEST_ROOT_DIR: "/app/data/ingest"
  WORKER_HEALTH_ENABLED: {{ .Values.worker.health.enabled | quote }}
  WORKER_HEALTH_PORT: {{ .Values.worker.health.port | quote }}
  API_KEYS: {{ include "ico-cache.apiKeysJson" . | squote }}

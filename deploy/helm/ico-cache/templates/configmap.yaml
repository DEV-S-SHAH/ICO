apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ico-cache.fullname" . }}-config
  labels:
    {{- include "ico-cache.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.env.ENVIRONMENT | quote }}
  API_HOST: {{ .Values.env.API_HOST | quote }}
  API_PORT: {{ .Values.env.API_PORT | quote }}
  REDIS_HOST: {{ include "ico-cache.fullname" . }}-redis
  REDIS_PORT: {{ .Values.redis.service.port | quote }}
  QDRANT_HOST: {{ include "ico-cache.fullname" . }}-qdrant
  QDRANT_PORT: {{ .Values.qdrant.service.httpPort | quote }}
  OLLAMA_HOST: {{ .Values.env.OLLAMA_HOST | quote }}
  OLLAMA_MODEL: {{ .Values.env.OLLAMA_MODEL | quote }}
  LANGFUSE_HOST: {{ .Values.env.LANGFUSE_HOST | quote }}
  TENANT_ISOLATION_MODE: {{ .Values.tenants.isolation_mode | quote }}
  API_KEYS: {{ include "ico-cache.apiKeysJson" . | squote }}

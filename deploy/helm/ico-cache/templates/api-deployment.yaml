{{- $podSecurityContext := .Values.api.podSecurityContext | default .Values.podSecurityContext }}
{{- $containerSecurityContext := .Values.api.containerSecurityContext | default .Values.containerSecurityContext }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ico-cache.fullname" . }}-api
  labels:
    {{- include "ico-cache.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ico-cache.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  strategy:
    {{- toYaml .Values.api.strategy | nindent 2 }}
  template:
    metadata:
      labels:
        {{- include "ico-cache.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      {{- with .Values.api.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "ico-cache.podSpec" (dict "ctx" $ "podSecurityContext" $podSecurityContext) | nindent 6 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: {{ .Values.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            {{- toYaml .Values.topologySpreadConstraints.labelSelector | nindent 12 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      containers:
        - name: api
          image: {{ include "ico-cache.image" .Values.api.image | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            {{- toYaml $containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "ico-cache.fullname" . }}-config
            - secretRef:
                name: {{ include "ico-cache.secretName" . }}
          startupProbe:
            httpGet:
              path: /v1/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Readiness fails when a dependency is down, pulling the pod out of rotation.
          readinessProbe:
            httpGet:
              path: /v1/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /home/appuser/.cache
            - name: ingest
              mountPath: /app/data/ingest
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          {{- with .Values.api.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: ingest
          emptyDir: {}
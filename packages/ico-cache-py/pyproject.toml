[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ico-cache"
version = "1.0.0"
description = "ICO-Cache: Generalized LLM Semantic Cache"
authors = [{name = "Dev"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn>=0.28.0,<1.0.0",
    "qdrant-client>=1.8.0,<2.0.0",
    "redis>=5.0.0,<6.0.0",
    "fastembed>=0.2.0,<1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "PyPDF2>=3.0.0,<4.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "lancedb>=0.5.0,<1.0.0",
    "structlog>=24.1.0,<26.0.0",
    "litellm>=1.40.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]

[project.optional-dependencies]
# PDF and tree-sitter language support (used by loaders and their tests)
loaders = [
    "pymupdf>=1.24.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "pdf2image>=1.16.0",
    "pytesseract>=0.3.10",
]
# Full dev/test environment
dev = [
    "ico-cache[loaders]",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ico_cache = ["py.typed"]
